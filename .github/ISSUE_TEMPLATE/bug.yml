name: Bug report
description: Something does not work as the README or the guide says
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. The report asked for below is anonymous: versions, counts of profiles per browser family, states and warnings. It holds no path, no profile name or id, and no URL. browserGlass never sends it anywhere: read it, then paste it.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: A sentence or two. Please leave out site addresses you would rather keep private.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Enable the plugin\n2. Restart Firefox\n3. ..."
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      multiple: true
      options:
        - Firefox
        - LibreWolf
        - Zen
        - Floorp
        - Waterfox
        - Other (say which in the description)
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How is the browser installed?
      multiple: true
      options:
        - Distribution package
        - Flatpak
        - Snap
        - Other
  - type: textarea
    id: report
    attributes:
      label: Anonymous report
      description: |
        In the plugin settings, section "Status", press "Copy report" and paste it here. Or run `dms ipc call browserGlass report` (it copies the report to the clipboard and prints only OK), or `python3 -I ~/.config/dms/plugins/browserGlass/browserglass.py report` (it prints the report).
      render: text
    validations:
      required: true
